function handleAction(action,el){
  const id=el.dataset.id;
  switch(action){
    case 'nav':
      S.page=el.dataset.page;S.sub='';S.search='';render();break;
    case 'config-tab':
      S.sub=el.dataset.val;render();break;
    case 'open-modal':
      S.modal=el.dataset.modal;S.editId=el.dataset.editId||null;render();break;
    case 'close-modal':
      closeModal();break;
    case 'set-page':
      S.page=el.dataset.page;render();break;
    case 'filter-day':
      S.filterDay=el.dataset.val;render();break;
    case 'filter-film':
      S.filterFilm=el.dataset.val;render();break;
    case 'edit-num':{
      const part=db.participations.find(p=>p.id===id);
      if(!part)break;
      const inp=document.createElement('input');
      inp.type='text';inp.value=part.inscriptionNumber||'';inp.className='num-input';inp.placeholder='Nº';
      const save=()=>{part.inscriptionNumber=inp.value.trim();saveDB();render()};
      inp.addEventListener('blur',save);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.removeEventListener('blur',save);render();}});
      el.replaceWith(inp);inp.focus();inp.select();
      break;}
    case 'quick-film':
      S.modal='status-filmagem';S.editId=id;render();break;
    case 'toggle-check':{
      const part=db.participations.find(p=>p.id===id);
      if(part){
        const key=el.dataset.key;
        part[key]=!part[key];
        // Ao marcar reconhecimento como feito, avança o filmStatus
        if(key==='checkRecog'&&part[key]&&part.filmStatus==='aguardando'){
          part.filmStatus='reconhecimento';
        }
        saveDB();render();
      }
      break;}
    case 'quick-desp':
      S._prefillDespCat=el.dataset.cat;S.modal='nova-despesa';render();break;
    case 'set-film-status':{
      const part=db.participations.find(p=>p.id===id);
      if(part){part.filmStatus=el.dataset.val;saveDB();showToast('Status atualizado');closeModal();}
      break;}
    case 'open-part':
      S.modal='editar-participacao';S.editId=id;render();break;
    case 'open-client':
      S.modal='ver-cliente';S.editId=id;render();break;
    case 'close-open-part':
      S.modal='editar-participacao';S.editId=id;render();break;
    case 'new-part-for-client':
      S._prefillClient=id;S.modal='nova-participacao';render();break;
    case 'export-data':{
      const json=JSON.stringify(db,null,2);
      const blob=new Blob([json],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=`ondigital_backup_${todayISO()}.json`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Dados exportados com sucesso');break;}
    case 'import-data':{
      const inp=document.createElement('input');
      inp.type='file';inp.accept='.json,application/json';
      inp.addEventListener('change',()=>{
        const file=inp.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=e=>{
          try{
            const data=JSON.parse(e.target.result);
            if(!data.events||!data.clients){showToast('Arquivo inválido — não é um backup ON Digital','error');return;}
            if(!confirm(`Importar ${data.clients.length} cliente(s) e ${(data.participations||[]).length} participação(ões)?\n\nISTO SUBSTITUIRÁ todos os dados atuais.`))return;
            localStorage.setItem('ondigital_v3',JSON.stringify(data));
            showToast('Dados importados! Recarregando...');
            setTimeout(()=>location.reload(),1500);
          }catch{showToast('Erro ao ler arquivo','error');}
        };
        reader.readAsText(file);
      });
      inp.click();break;}
    case 'edit-client':
      S.modal='editar-cliente';S.editId=id;render();break;
    case 'open-add-horse':
      S._horseClient=id;S.modal='add-horse';render();break;
    case 'back-to-client':
      S.modal='ver-cliente';S.editId=id;render();break;
    case 'del-horse':{
      const horse=db.horses.find(h=>h.id===id);
      if(!horse)break;
      const nParts=db.participations.filter(p=>p.horseId===id).length;
      const hClientId=horse.clientId;
      if(!confirm(`Remover "${horse.name}"?${nParts>0?` Isso apagará ${nParts} participação(ões).`:''}`))break;
      if(nParts>0)db.participations=db.participations.filter(p=>p.horseId!==id);
      db.contracts.forEach(c=>{if(c.horseId===id)c.horseId=null;});
      db.horses=db.horses.filter(h=>h.id!==id);
      saveDB();showToast('Cavalo removido');
      S.modal='ver-cliente';S.editId=hClientId;render();break;}
    case 'edit-event':
      S.modal='novo-evento';S.editId=id;render();break;
    case 'edit-product':
      S.modal='editar-produto';S.editId=id;render();break;
    case 'del-part':
      if(!confirm('Remover esta participação?'))break;
      db.participations=db.participations.filter(p=>p.id!==id);
      saveDB();showToast('Participação removida');closeModal();break;
    case 'del-expense':
      db.expenses=db.expenses.filter(e=>e.id!==id);saveDB();showToast('Despesa removida');render();break;
    case 'del-event':
      if(!confirm('Remover este evento?'))break;
      db.participations=db.participations.filter(p=>p.eventId!==id);
      db.contracts=db.contracts.filter(c=>c.eventId!==id||c.billingModel==='pacote');
      db.expenses=db.expenses.filter(e=>e.eventId!==id);
      db.team=db.team.filter(t=>t.eventId!==id);
      db.equipment=db.equipment.filter(e=>e.eventId!==id);
      db.events=db.events.filter(e=>e.id!==id);
      if(S.eventId===id)S.eventId=db.events[0]?.id||null;
      saveDB();render();break;
    case 'del-product':
      db.products=db.products.filter(p=>p.id!==id);saveDB();showToast('Produto removido');render();break;
    case 'del-team':
      db.team=db.team.filter(t=>t.id!==id);saveDB();showToast('Membro removido');render();break;
    case 'del-equip':
      db.equipment=db.equipment.filter(e=>e.id!==id);saveDB();showToast('Equipamento removido');render();break;
    case 'del-client':{
      const client=db.clients.find(c=>c.id===id);
      if(!client)break;
      const nParts=db.participations.filter(p=>p.clientId===id).length;
      const msg=nParts>0
        ?`Remover "${client.name}"? Isso apagará ${nParts} participação(ões) e todos os contratos e cavalos vinculados.`
        :`Remover "${client.name}"? Cavalos e contratos vinculados também serão removidos.`;
      if(!confirm(msg))break;
      const horseIds=db.horses.filter(h=>h.clientId===id).map(h=>h.id);
      db.participations=db.participations.filter(p=>p.clientId!==id);
      db.contracts=db.contracts.filter(c=>c.clientId!==id);
      db.horses=db.horses.filter(h=>h.clientId!==id);
      db.clients=db.clients.filter(c=>c.id!==id);
      saveDB();showToast('Cliente removido');closeModal();break;}
  }
}

function handleForm(action,form){
  const fd=new FormData(form);
  const v=k=>fd.get(k)||'';

  switch(action){
    case 'save-evento':{
      const existing=v('id')?db.events.find(e=>e.id===v('id')):null;
      if(existing){
        Object.assign(existing,{name:v('name'),startDate:v('startDate'),endDate:v('endDate'),location:v('location'),organizer:v('organizer'),notes:v('notes')});
      }else{
        const ne={id:uid(),name:v('name'),startDate:v('startDate'),endDate:v('endDate'),location:v('location'),organizer:v('organizer'),notes:v('notes')};
        db.events.push(ne);S.eventId=ne.id;
      }
      saveDB();showToast('Evento salvo');closeModal();break;}

    case 'save-participacao':{
      // 1. Resolve client
      let clientId=v('clientId');
      if(clientId==='__new__'){
        const nc={id:uid(),name:v('newClientName')||'Sem nome',phone:v('newClientPhone'),instagram:v('newClientInstagram'),notes:''};
        db.clients.push(nc);clientId=nc.id;
      }
      if(!clientId){showToast('Selecione um cliente','error');return;}

      const partId=v('id');
      const billingModel=v('billingModel')||'por_cavalo';
      const isPacote=billingModel==='pacote';
      const existingContractId=v('contractId');

      if(partId){
        // === EDIT MODE: horse resolved globally ===
        let horseId=v('horseId');
        if(horseId==='__new_horse__'){
          const nh={id:uid(),clientId,name:v('newHorseName')||'Cavalo',notes:''};
          db.horses.push(nh);horseId=nh.id;
        }
        if(!horseId){showToast('Selecione um cavalo','error');return;}
        let contractId=existingContractId;
        if(existingContractId){
          const c=db.contracts.find(c=>c.id===existingContractId);
          if(c){
            if(!isPacote){Object.assign(c,{billingModel,horseId:billingModel==='por_cavalo'?horseId:null,
              agreedValue:parseFloat(v('agreedValue'))||0,paidValue:parseFloat(v('paidValue'))||0,
              paymentMethod:v('paymentMethod'),payStatus:v('payStatus')});}
            else{Object.assign(c,{billingModel,packageType:v('packageType'),eventId:null});}
          }
        }else{
          const nc={id:uid(),clientId,eventId:isPacote?null:S.eventId,billingModel,
            horseId:billingModel==='por_cavalo'?horseId:null,packageType:isPacote?v('packageType'):null,
            agreedValue:isPacote?0:parseFloat(v('agreedValue'))||0,paidValue:isPacote?0:parseFloat(v('paidValue'))||0,
            paymentMethod:v('paymentMethod')||'Pix',payStatus:isPacote?'pacote':v('payStatus')||'pendente',notes:''};
          db.contracts.push(nc);contractId=nc.id;
        }
        const proofTime=v('proofTime');
        const recognitionOverride=fd.get('recognitionOverride')==='on';
        let recognitionTime=v('recognitionTime');
        if(!recognitionOverride||!recognitionTime)recognitionTime=calcRecog(proofTime);
        const p=db.participations.find(p=>p.id===partId);
        if(p)Object.assign(p,{clientId,horseId,contractId,
          day:v('day'),proofTime,recognitionTime,recognitionOverride,
          proofName:v('proofName'),inscriptionNumber:v('inscriptionNumber'),category:v('category'),
          filmStatus:v('filmStatus'),cameraman:v('cameraman'),materialLink:v('materialLink'),filmNotes:v('notes')});

      }else{
        // === CREATE MODE: horse resolved per day row ===
        const nc={id:uid(),clientId,eventId:isPacote?null:S.eventId,billingModel,
          horseId:null,packageType:isPacote?v('packageType'):null,
          agreedValue:isPacote?0:parseFloat(v('agreedValue'))||0,paidValue:isPacote?0:parseFloat(v('paidValue'))||0,
          paymentMethod:v('paymentMethod')||'Pix',payStatus:isPacote?'pacote':v('payStatus')||'pendente',notes:''};
        db.contracts.push(nc);
        const contractId=nc.id;
        const days=fd.getAll('day');
        const proofTimes=fd.getAll('proofTime');
        const proofNames=fd.getAll('proofName');
        const inscNums=fd.getAll('inscriptionNumber');
        const rowHorseIds=fd.getAll('rowHorseId');
        const rowNewHorses=fd.getAll('rowNewHorse');
        const category=v('category');
        const cameraman=v('cameraman');
        const materialLink=v('materialLink');
        const filmNotes=v('notes');
        for(let i=0;i<days.length;i++){
          let rowHorseId=rowHorseIds[i]||'';
          if(rowHorseId==='__new_horse__'){
            const hn=(rowNewHorses[i]||'').trim()||'Cavalo';
            const nh={id:uid(),clientId,name:hn,notes:''};
            db.horses.push(nh);rowHorseId=nh.id;
          }
          if(!rowHorseId){showToast('Selecione um cavalo em todos os dias','error');return;}
          const proofTime=proofTimes[i]||'';
          const pName=proofNames[i]||'';
          const pInsc=inscNums[i]||'';
          // Bloqueia duplicata: mesmo cliente + mesmo número + mesma prova
          const dupManual=pName&&pInsc&&db.participations.find(x=>
            x.eventId===S.eventId&&x.clientId===clientId&&x.proofName===pName&&x.inscriptionNumber===pInsc
          );
          if(dupManual){showToast(`Nº ${pInsc} já existe na prova "${pName}"— duplicata ignorada`,'error');continue;}
          db.participations.push({
            id:uid(),eventId:S.eventId,clientId,horseId:rowHorseId,contractId,
            day:days[i],proofTime,recognitionTime:calcRecog(proofTime),recognitionOverride:false,
            proofName:pName,inscriptionNumber:pInsc,category,
            filmStatus:'aguardando',cameraman,materialLink,filmNotes,
            checkRecog:false,checkPaddock:false,checkProva:false,
          });
        }
      }
      S._prefillClient=null;
      saveDB();showToast('Participação salva');closeModal();break;}

    case 'save-horse':{
      const clientId=v('clientId');
      const horseName=v('horseName').trim();
      if(!horseName){showToast('Informe o nome do cavalo','error');return;}
      db.horses.push({id:uid(),clientId,name:horseName,notes:v('horseNotes')});
      saveDB();showToast('Cavalo cadastrado');
      S._horseClient=null;S.modal='ver-cliente';S.editId=clientId;render();break;}

    case 'save-edit-cliente':{
      const cid=v('id');
      const ec=db.clients.find(c=>c.id===cid);
      if(!ec){showToast('Cliente não encontrado','error');return;}
      const nm=v('clientName').trim();
      if(!nm){showToast('Nome obrigatório','error');return;}
      Object.assign(ec,{name:nm,phone:v('clientPhone'),instagram:v('clientInstagram'),email:v('clientEmail'),notes:v('clientNotes')});
      saveDB();showToast('Cliente atualizado');S.modal='ver-cliente';S.editId=cid;render();break;}

    case 'save-novo-cliente':{
      const clientName=v('clientName').trim();
      if(!clientName){showToast('Nome obrigatório','error');return;}
      const nc={id:uid(),name:clientName,phone:v('clientPhone'),instagram:v('clientInstagram'),notes:v('clientNotes')};
      db.clients.push(nc);
      const horseNames=fd.getAll('horseName');
      const horseNotesArr=fd.getAll('horseNotes');
      horseNames.forEach((hn,i)=>{if(hn.trim())db.horses.push({id:uid(),clientId:nc.id,name:hn.trim(),notes:horseNotesArr[i]||''});});
      saveDB();showToast('Cliente cadastrado');closeModal();break;}

    case 'save-despesa':
      db.expenses.push({id:uid(),eventId:S.eventId,description:v('description'),
        category:v('category'),date:v('date'),value:parseFloat(v('value'))||0,
        method:v('method'),responsible:v('responsible'),notes:v('notes')});
      saveDB();showToast('Despesa registrada');closeModal();break;

    case 'save-produto':{
      const pid=v('id');
      if(pid){const p=db.products.find(p=>p.id===pid);if(p)Object.assign(p,{name:v('name'),price:parseFloat(v('price'))||0,cost:parseFloat(v('cost'))||0,description:v('description')});}
      else db.products.push({id:uid(),name:v('name'),price:parseFloat(v('price'))||0,cost:parseFloat(v('cost'))||0,description:v('description')});
      saveDB();showToast('Produto salvo');closeModal();break;}

    case 'save-membro':
      db.team.push({id:uid(),eventId:S.eventId,name:v('name'),role:v('role'),phone:v('phone'),
        dailyRate:parseFloat(v('dailyRate'))||0,days:parseFloat(v('days'))||1});
      saveDB();showToast('Membro adicionado');closeModal();break;

    case 'save-equip':
      db.equipment.push({id:uid(),eventId:S.eventId,name:v('name'),responsible:v('responsible'),status:v('status'),notes:v('notes')});
      saveDB();showToast('Equipamento salvo');closeModal();break;
  }
}

// ═══════════════════════════════════════════════════════════════
// BIND AFTER RENDER
// ═══════════════════════════════════════════════════════════════
function bindAfter(){
  // Cronômetro regressivo do reconhecimento (30 min antes da prova)
  if(window._recogCountdown){clearInterval(window._recogCountdown);window._recogCountdown=null;}
  const cdEl=document.getElementById('recog-countdown');
  const timerEl=document.getElementById('recog-timer');
  if(cdEl&&timerEl){
    let secs=parseInt(cdEl.dataset.secs)||0;
    window._recogCountdown=setInterval(()=>{
      secs--;
      if(secs<=0){
        clearInterval(window._recogCountdown);window._recogCountdown=null;
        render(); // tempo esgotado — avança para próximo reconhecimento
        return;
      }
      const mm=String(Math.floor(secs/60)).padStart(2,'0');
      const ss=String(secs%60).padStart(2,'0');
      timerEl.textContent=`${mm}:${ss}`;
    },1000);
  }

  // Event select
  const evtSel=document.getElementById('evt-select');
  if(evtSel)evtSel.addEventListener('change',()=>{S.eventId=evtSel.value||null;saveDB();render()});

  // Proof time → auto-fill recognition
  const proofIn=document.getElementById('inp-proof-time');
  const recogIn=document.getElementById('inp-recog');
  const overrideIn=document.getElementById('recog-override');
  if(proofIn&&recogIn){
    proofIn.addEventListener('input',()=>{
      if(overrideIn&&overrideIn.checked)return;
      recogIn.value=calcRecog(proofIn.value);
    });
  }

  // Client select → update horse dropdown
  const selClient=document.getElementById('sel-client');
  const selHorse=document.getElementById('sel-horse');
  const newClientFields=document.getElementById('new-client-fields');
  const newHorseFields=document.getElementById('new-horse-fields');
  if(selClient){
    selClient.addEventListener('change',()=>{
      const val=selClient.value;
      if(newClientFields)newClientFields.style.display=val==='__new__'?'block':'none';
      {
        const horses=(val&&val!=='__new__')?db.horses.filter(h=>h.clientId===val):[];
        const horseOpts='<option value="">— Selecione —</option>'+
          horses.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')+
          '<option value="__new_horse__">+ Novo cavalo...</option>';
        // Edit mode: global horse dropdown
        if(selHorse){selHorse.innerHTML=horseOpts;if(newHorseFields)newHorseFields.style.display='none';}
        // Create mode: per-row horse dropdowns
        document.querySelectorAll('.row-horse-sel').forEach(sel=>{sel.innerHTML=horseOpts;});
      }
    });
    if(S._prefillClient&&selClient.value===''){
      selClient.value=S._prefillClient;
      selClient.dispatchEvent(new Event('change'));
    }
  }
  if(selHorse){
    selHorse.addEventListener('change',()=>{
      if(newHorseFields)newHorseFields.style.display=selHorse.value==='__new_horse__'?'block':'none';
    });
  }

  // Billing model → toggle fields
  const selBilling=document.getElementById('sel-billing');
  const pacoteFields=document.getElementById('pacote-fields');
  const valueFields=document.getElementById('value-fields');
  if(selBilling){
    selBilling.addEventListener('change',()=>{
      const isPacote=selBilling.value==='pacote';
      if(pacoteFields)pacoteFields.style.display=isPacote?'':'none';
      if(valueFields)valueFields.style.display=isPacote?'none':'';
    });
  }

  // Search
  document.querySelectorAll('[data-change="search"]').forEach(el=>{
    el.addEventListener('input',e=>{
      const v=e.target.value;const id=el.id;
      S.search=v;render();
      const restored=document.getElementById(id);
      if(restored){restored.focus();restored.setSelectionRange(v.length,v.length);}
    });
  });

  // Horse rows in "Novo Cliente" modal
  const btnAddHorseRow=document.getElementById('btn-add-horse-row');
  const horsesList=document.getElementById('horses-list');
  if(btnAddHorseRow&&horsesList){
    btnAddHorseRow.addEventListener('click',()=>{
      const row=document.createElement('div');
      row.className='horse-row';
      row.style.cssText='background:var(--surf2);border-radius:var(--r-sm);padding:10px;margin-bottom:8px';
      row.innerHTML=`<div class="form-row" style="align-items:flex-end">
        <div class="field"><label>Nome do Cavalo</label><input name="horseName" placeholder="Nome do cavalo"></div>
        <div class="field"><label>Observações</label><input name="horseNotes" placeholder="Raça, cor..."></div>
        <button type="button" class="btn btn-ghost btn-sm horse-row-del" style="margin-bottom:2px" title="Remover">✕</button>
      </div>`;
      horsesList.appendChild(row);
    });
    horsesList.addEventListener('click',e=>{
      if(e.target.classList.contains('horse-row-del')){
        const rows=horsesList.querySelectorAll('.horse-row');
        if(rows.length>1)e.target.closest('.horse-row').remove();
      }
    });
  }

  // Multi-day add button (create participation mode)
  const btnAddDay=document.getElementById('btn-add-day');
  const daysList=document.getElementById('days-list');
  if(btnAddDay&&daysList){
    btnAddDay.addEventListener('click',()=>{
      const today=todayISO();
      const clientVal=selClient?selClient.value:'';
      const horses=clientVal&&clientVal!=='__new__'?db.horses.filter(h=>h.clientId===clientVal):[];
      const horseOpts='<option value="">— Selecione —</option>'+
        horses.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')+
        '<option value="__new_horse__">+ Novo cavalo...</option>';
      const row=document.createElement('div');
      row.className='day-row';
      row.style.cssText='background:var(--surf2);border-radius:var(--r-sm);padding:10px;margin-bottom:8px';
      row.innerHTML=`<div class="form-row" style="align-items:flex-end">
        <div class="field"><label>Data</label><input type="date" name="day" value="${today}"></div>
        <div class="field"><label>Horário Prova</label><input type="time" name="proofTime"></div>
        <button type="button" class="btn btn-ghost btn-sm day-row-del" style="margin-bottom:2px" title="Remover">✕</button>
      </div>
      <div class="field"><label>Cavalo</label>
        <select name="rowHorseId" class="row-horse-sel" required>${horseOpts}</select>
      </div>
      <div class="new-horse-row" style="display:none">
        <div class="field"><label>Nome do Novo Cavalo</label><input name="rowNewHorse" placeholder="Nome do cavalo"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Nome da Prova</label><input name="proofName" placeholder="Ex: CCE 1.00m"></div>
        <div class="field"><label>Nº Inscrição</label><input name="inscriptionNumber"></div>
      </div>`;
      daysList.appendChild(row);
    });
    daysList.addEventListener('click',e=>{
      if(e.target.classList.contains('day-row-del')){
        const rows=daysList.querySelectorAll('.day-row');
        if(rows.length>1)e.target.closest('.day-row').remove();
      }
    });
    daysList.addEventListener('change',e=>{
      if(e.target.classList.contains('row-horse-sel')){
        const newHorseRow=e.target.closest('.day-row').querySelector('.new-horse-row');
        if(newHorseRow)newHorseRow.style.display=e.target.value==='__new_horse__'?'block':'none';
      }
    });
  }

  // Overlay click closes modal
  const overlay=document.getElementById('overlay');
  if(overlay)overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
}

// ═══════════════════════════════════════════════════════════════
// AUTO STATUS — reconhecimento
// ═══════════════════════════════════════════════════════════════
function autoUpdateStatuses(){
  if(!S.eventId)return;
  const today=todayISO();
  const now=toMins(nowTime());
  let changed=false;
  db.participations.forEach(p=>{
    if(p.eventId!==S.eventId)return;
    if(!p.day||p.day!==today)return;
    if(p.filmStatus!=='aguardando')return;
    if(p.recognitionTime&&toMins(p.recognitionTime)<=now){p.filmStatus='reconhecimento';changed=true;}
  });
  if(changed){saveDB();if(!S.modal)render();}
}
setInterval(autoUpdateStatuses,30000);
autoUpdateStatuses();

// ═══════════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════════════════════════
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`ondigital-v3-${todayISO()}.json`;a.click();
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      try{db=JSON.parse(ev.target.result);saveDB();S.eventId=db.events[0]?.id||null;render();showToast('Dados importados e sincronizados!');}
      catch(err){showToast('Erro ao importar','error');}
    };r.readAsText(f);
  };inp.click();
}

  // Empurra dados locais se Firestore estiver vazio; senão, ouve atualizações em tempo real
  window._fsDb.collection('ondigital').doc('data').onSnapshot(snap=>{
    if(!snap.exists){
      window._fsDb.collection('ondigital').doc('data').set(db);
      return;
    }
    const remote=snap.data();
    const dataStr=JSON.stringify(remote);
    if(dataStr===_lastSaved)return;
    const remoteTs=remote._ts||0;
    const localTs=db._ts||0;
    if(localTs>=remoteTs){
      // Local é mais novo: sobrescreve o Firestore
      window._fsDb.collection('ondigital').doc('data').set(db);
      return;
    }
    // Remoto é mais novo: atualiza local
    db=remote;
    _lastSaved=dataStr;
    localStorage.setItem(STORAGE_KEY,dataStr);
    if(!S.modal)render();
    else showToast('Dados sincronizados de outro dispositivo');
  },err=>console.warn('Firestore sync error',err));
}catch(e){console.warn('Firebase init error',e);}
