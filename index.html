<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.json">
<title>ON Digital — Gestão de Eventos</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08111E;--surf:#0F1E33;--surf2:#172840;--surf3:#1E3352;
  --gold:#C09A35;--gold-l:#D4AF50;--gold-d:#9A7A20;
  --text:#EEF2FA;--muted:#6B82A0;--border:#1E3352;--border2:#253F60;
  --green:#25C07A;--amber:#E8920A;--red:#DC4A4A;--blue:#4A8ED6;--purple:#8B70D4;--teal:#12B8A6;
  --green-bg:rgba(37,192,122,.12);--amber-bg:rgba(232,146,10,.12);--red-bg:rgba(220,74,74,.12);
  --blue-bg:rgba(74,142,214,.12);--purple-bg:rgba(139,112,212,.12);--teal-bg:rgba(18,184,166,.12);
  --sidebar:200px;--header:52px;--bottom:60px;
  --r:8px;--r-lg:12px;--r-sm:5px;
}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hdr{height:var(--header);background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:50;padding-top:env(safe-area-inset-top);box-sizing:border-box}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--surf);border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;padding:8px 0;display:none;flex-direction:column}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 14px)}
.bottom-nav{height:var(--bottom);background:var(--surf);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
@media(min-width:768px){.sidebar{display:flex}.bottom-nav{display:none}.content{padding:20px 24px}}
.hdr-logo{font-weight:700;font-size:15px;color:var(--gold);letter-spacing:.04em;white-space:nowrap}
.hdr-logo span{color:var(--muted);font-weight:400}
.hdr-evt{flex:1;min-width:0}
.hdr-evt select{width:100%;background:var(--surf2);border:1px solid var(--border2);color:var(--text);border-radius:var(--r-sm);padding:6px 8px;font-size:13px;cursor:pointer;outline:none}
.hdr-evt select:focus{border-color:var(--gold)}
.hdr-btn{width:36px;height:36px;background:var(--surf2);border:1px solid var(--border2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;transition:color .15s,border-color .15s}
.hdr-btn:hover{color:var(--gold);border-color:var(--gold-d)}
.sb-nav{padding:4px 8px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.sb-item:hover{background:var(--surf2);color:var(--text)}
.sb-item.active{background:rgba(192,154,53,.12);color:var(--gold)}
.sb-item svg{flex-shrink:0;width:16px;height:16px}
.sb-section{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted);padding:14px 18px 4px;text-transform:uppercase}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.02em;transition:color .15s;border:none;background:none;-webkit-tap-highlight-color:transparent}
.bn-item svg{width:20px;height:20px}
.bn-item.active{color:var(--gold)}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.card-sm{padding:10px 12px}
.card-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card-grid{display:grid;gap:10px}
.kpi{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 14px 12px}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-size:22px;font-weight:700;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}
.kpi.gold .kpi-value{color:var(--gold)}.kpi.green .kpi-value{color:var(--green)}.kpi.red .kpi-value{color:var(--red)}.kpi.amber .kpi-value{color:var(--amber)}.kpi.blue .kpi-value{color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--gold);color:#000}.btn-primary:hover{background:var(--gold-l)}
.btn-ghost{background:var(--surf2);color:var(--text);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--surf3)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(220,74,74,.25)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:var(--r-sm)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge-aguardando{color:#8898AA;background:rgba(136,152,170,.12)}
.badge-reconhecimento{color:var(--blue);background:var(--blue-bg)}
.badge-proximo{color:var(--amber);background:var(--amber-bg)}
.badge-filmado{color:var(--green);background:var(--green-bg)}
.badge-edicao{color:var(--purple);background:var(--purple-bg)}
.badge-entregue{color:var(--teal);background:var(--teal-bg)}
.badge-nao_filmado{color:var(--muted);background:rgba(107,130,160,.1)}
.badge-pago{color:var(--green);background:var(--green-bg)}
.badge-parcial{color:var(--amber);background:var(--amber-bg)}
.badge-pendente{color:var(--red);background:var(--red-bg)}
.badge-cortesia{color:var(--purple);background:var(--purple-bg)}
.badge-por_cavalo{color:#C09A35;background:rgba(192,154,53,.13);border:1px solid rgba(192,154,53,.22)}
.badge-por_prova{color:#4A8ED6;background:rgba(74,142,214,.13);border:1px solid rgba(74,142,214,.22)}
.badge-pacote{color:#8B70D4;background:rgba(139,112,212,.13);border:1px solid rgba(139,112,212,.22)}
.badge-mensal{color:#4A8ED6;background:rgba(74,142,214,.13);border:1px solid rgba(74,142,214,.22)}
.badge-trimestral{color:#8B70D4;background:rgba(139,112,212,.13);border:1px solid rgba(139,112,212,.22)}
.badge-semestral{color:#12B8A6;background:rgba(18,184,166,.13);border:1px solid rgba(18,184,166,.22)}
.badge-anual{color:#25C07A;background:rgba(37,192,122,.13);border:1px solid rgba(37,192,122,.22)}
.form-grid{display:grid;gap:12px}
.form-row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surf2);border:1px solid var(--border2);color:var(--text);border-radius:var(--r-sm);padding:8px 10px;font-size:16px;outline:none;transition:border-color .15s;font-family:inherit;width:100%}
@media(min-width:600px){.field input,.field select,.field textarea{font-size:13px}}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:70px}
.field select option{background:var(--surf2)}
.field input[type="checkbox"]{width:auto;cursor:pointer}
.field-hint{font-size:11px;color:var(--muted);margin-top:2px}
.form-section{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border);margin-top:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
@media(min-width:600px){.modal-overlay{align-items:center}}
.modal{background:var(--surf);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.modal{border-radius:var(--r-lg);max-height:88dvh}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-hdr h3{font-size:15px;font-weight:700}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px;flex:1}
.modal-footer{padding:12px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}

.modal-footer .btn{flex:1;justify-content:center}
.list-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .15s,background .15s;text-align:left;width:100%}
.list-item:hover{border-color:var(--border2);background:var(--surf2)}
.list-item-info{flex:1;min-width:0}
.list-item-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-sub{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.entry-row{display:flex;gap:10px;padding:10px 12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .15s}
.entry-row:hover{border-color:var(--border2)}
.entry-time{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;flex-shrink:0}
.entry-time-main{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.entry-time-recog{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.entry-divider{width:1px;background:var(--border2);flex-shrink:0}
.entry-info{flex:1;min-width:0}
.entry-client{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-horse{font-size:12px;color:var(--muted);margin-top:1px}
.entry-meta{font-size:11px;color:var(--muted);margin-top:3px}
.entry-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.entry-num{font-size:18px;font-weight:800;color:var(--border2);min-width:30px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}
.agora-next{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden}
.agora-next::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.agora-next.recog::before{background:var(--blue)}.agora-next.prova::before{background:var(--amber)}
.agora-eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.agora-eyebrow.recog{color:var(--blue)}.agora-eyebrow.prova{color:var(--amber)}
.agora-client{font-size:20px;font-weight:800;line-height:1.1}
.agora-horse{font-size:13px;color:var(--muted);margin-top:3px}
.agora-time{font-size:28px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:6px}
.agora-meta{font-size:12px;color:var(--muted);margin-top:3px}
.agora-empty{text-align:center;padding:20px;color:var(--muted)}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-opt{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r);cursor:pointer;border:2px solid var(--border);background:var(--surf2);transition:all .15s}
.status-opt:hover{border-color:var(--border2)}.status-opt.selected{border-color:currentColor}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-opt-label{font-size:13px;font-weight:600}
.search-wrap{position:relative}.search-wrap input{padding-left:32px}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:16px;font-weight:700}
.sec-sub{font-size:12px;color:var(--muted);margin-top:1px}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ftab{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surf2);color:var(--muted);transition:all .15s;white-space:nowrap}
.ftab.active{background:rgba(192,154,53,.15);border-color:var(--gold-d);color:var(--gold)}
.toast{position:fixed;bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--border2);color:var(--text);padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:300;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.success{border-color:var(--green);background:var(--green-bg)}.toast.error{border-color:var(--red);background:var(--red-bg)}
@media(min-width:768px){.toast{bottom:20px}}
.fin-bar-wrap{display:flex;flex-direction:column;gap:8px}
.fin-bar-row{display:flex;align-items:center;gap:10px}
.fin-bar-label{font-size:12px;color:var(--muted);min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-bar-track{flex:1;height:6px;background:var(--surf3);border-radius:3px;overflow:hidden}
.fin-bar-fill{height:100%;border-radius:3px;background:var(--gold);transition:width .4s ease}
.fin-bar-val{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 24px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.4}.empty p{font-size:14px;max-width:260px}
.divider{height:1px;background:var(--border);margin:12px 0}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.ml-auto{margin-left:auto}
.page-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;gap:0;overflow-x:auto}
.page-tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.page-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.clock{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.stages{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.stage-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:transparent;color:var(--muted);transition:all .15s;letter-spacing:.01em;white-space:nowrap}
.stage-btn:hover{border-color:var(--gold-d);color:var(--gold)}
.stage-btn.done{background:rgba(37,192,122,.15);border-color:var(--green);color:var(--green)}
.ordem-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);cursor:default;transition:border-color .15s}
.ordem-card:hover{border-color:var(--border2)}
.ordem-num-box{width:52px;height:52px;border-radius:var(--r);background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:border-color .15s,background .15s}
.ordem-num-box:hover{border-color:var(--gold);background:rgba(192,154,53,.08)}
.ordem-num-box.editing{border-color:var(--gold)}
.ordem-info{flex:1;min-width:0}
.ordem-client{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ordem-horse{font-size:12px;color:var(--muted);margin-top:2px}
.ordem-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.ordem-time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;align-items:center;gap:3px}
.num-input{width:52px;height:52px;background:var(--surf2);border:2px solid var(--gold);color:var(--text);border-radius:var(--r);font-size:22px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;outline:none;padding:0}
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surf2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surf2)}
.del-btn{color:var(--muted);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;transition:color .15s}
.del-btn:hover{color:var(--red)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.billing-sel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.billing-opt{padding:8px;border-radius:var(--r-sm);border:2px solid var(--border2);background:var(--surf2);cursor:pointer;text-align:center;transition:all .15s}
.billing-opt:hover{border-color:var(--border2);background:var(--surf3)}
.billing-opt.active{border-color:var(--gold);background:rgba(192,154,53,.08)}
.billing-opt-label{font-size:12px;font-weight:700;color:var(--text)}
.billing-opt-desc{font-size:10px;color:var(--muted);margin-top:2px}
.client-avatar{width:38px;height:38px;border-radius:50%;background:rgba(192,154,53,.15);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--gold);flex-shrink:0;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// Polyfill requestSubmit para iOS < 15.4
if(!HTMLFormElement.prototype.requestSubmit){
  HTMLFormElement.prototype.requestSubmit=function(){
    const btn=document.createElement('input');
    btn.type='submit';btn.style.display='none';
    this.appendChild(btn);btn.click();this.removeChild(btn);
  };
}
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const FILM=[
  {id:'aguardando',    label:'Aguardando',       color:'#8898AA'},
  {id:'reconhecimento',label:'Reconhecimento',   color:'#4A8ED6'},
  {id:'proximo',       label:'Próximo a saltar',  color:'#E8920A'},
  {id:'filmado',       label:'Filmado',           color:'#25C07A'},
  {id:'edicao',        label:'Em edição',         color:'#8B70D4'},
  {id:'entregue',      label:'Entregue',          color:'#12B8A6'},
  {id:'nao_filmado',   label:'Não filmado',       color:'#4A5568'},
];
const PAY_STATUS=[
  {id:'pendente',label:'Pendente',color:'#DC4A4A'},
  {id:'parcial', label:'Parcial', color:'#E8920A'},
  {id:'pago',    label:'Pago',    color:'#25C07A'},
  {id:'cortesia',label:'Cortesia',color:'#8B70D4'},
];
const PAY_METHODS=['Pix','Dinheiro','Cartão','Transferência','Cheque','Outros'];
const BILLING_MODELS=[
  {id:'por_cavalo',label:'Por Cavalo',desc:'Valor por cavalo'},
  {id:'por_prova', label:'Por Prova', desc:'Valor pela prova inteira'},
  {id:'pacote',    label:'Pacote',    desc:'Contrato recorrente'},
];
const PACKAGE_TYPES=[
  {id:'mensal',    label:'Mensal'},
  {id:'trimestral',label:'Trimestral'},
  {id:'semestral', label:'Semestral'},
  {id:'anual',     label:'Anual'},

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cur(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)}
function fmtDate(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`}
function brNow(){return new Date(Date.now()-10800000)}
function todayISO(){const b=brNow();return b.getUTCFullYear()+'-'+String(b.getUTCMonth()+1).padStart(2,'0')+'-'+String(b.getUTCDate()).padStart(2,'0')}
function nowTime(){const b=brNow();return String(b.getUTCHours()).padStart(2,'0')+':'+String(b.getUTCMinutes()).padStart(2,'0')}
function calcRecog(t){if(!t)return'';const[h,m]=t.split(':').map(Number);let mins=h*60+m-30;if(mins<0)mins+=1440;return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}
function toMins(t){if(!t)return Infinity;const[h,m]=t.split(':').map(Number);return h*60+m}
function filmLabel(id){return FILM.find(f=>f.id===id)||FILM[0]}
function payLabel(id){return PAY_STATUS.find(p=>p.id===id)||PAY_STATUS[0]}
function billingLabel(id){return BILLING_MODELS.find(b=>b.id===id)||BILLING_MODELS[0]}
function billingBadge(bm,small){const b=billingLabel(bm);return`<span class="badge badge-${b.id}"${small?' style="font-size:10px"':''}>${b.label}</span>`}
function stageBtns(part){
  const s=[{key:'checkRecog',label:'Reconhecimento'},{key:'checkPaddock',label:'Paddock'},{key:'checkProva',label:'Prova'}];
  return`<div class="stages">${s.map(x=>`<button class="stage-btn${part[x.key]?' done':''}" data-action="toggle-check" data-id="${part.id}" data-key="${x.key}" onclick="event.stopPropagation();handleAction('toggle-check',this)">${x.label}${part[x.key]?' ✓':''}</button>`).join('')}</div>`;

const STORAGE_KEY='ondigital_v3';

function defaultDB(){
  return{
    events:[],
    clients:[],    // global — sem eventId
    horses:[],     // {id, clientId, name, notes}
    contracts:[],  // {id, clientId, eventId|null, billingModel, horseId|null, packageType|null, agreedValue, paidValue, paymentMethod, payStatus, notes}
    participations:[], // {id, eventId, clientId, horseId, contractId, day, proofName, inscriptionNumber, category, proofTime, recognitionTime, recognitionOverride, filmStatus, cameraman, materialLink, filmNotes, checkRecog, checkPaddock, checkProva}
    expenses:[],
    team:[],
    equipment:[],
    products:[
      {id:uid(),name:'Vídeo 4K Personalizado',price:150,cost:25},
      {id:uid(),name:'Vídeo Standard',price:80,cost:15},
      {id:uid(),name:'Pacote Vídeo + Fotos',price:250,cost:45},
      {id:uid(),name:'Transmissão ao Vivo',price:500,cost:100},
    ],
  };
}

function migrateV2(old){
  const db=defaultDB();
  db.events=old.events||[];
  db.expenses=old.expenses||[];
  db.team=old.team||[];
  db.equipment=old.equipment||[];
  db.products=old.products||db.products;

  // Deduplica clientes por nome (global)
  const nameMap={};
  (old.clients||[]).forEach(c=>{
    const key=c.name.toLowerCase().trim();
    if(!nameMap[key]){
      const nc={id:uid(),name:c.name,phone:c.phone||'',instagram:c.instagram||'',notes:c.notes||''};
      db.clients.push(nc);
      nameMap[key]=nc.id;
    }
  });

  // Converte entries → horses + contracts + participations
  (old.entries||[]).forEach(e=>{
    const oldClient=(old.clients||[]).find(c=>c.id===e.clientId)||{name:'Sem nome'};
    const clientId=nameMap[oldClient.name.toLowerCase().trim()]||null;
    if(!clientId)return;

    // Mapa billingModel do tipo do cliente
    const oldTipo=oldClient.tipo||'por_video';
    let billingModel='por_cavalo';
    let packageType=null;
    if(oldTipo==='mensal'||oldTipo==='trimestral'||oldTipo==='semestral'||oldTipo==='anual'){
      billingModel='pacote';packageType=oldTipo;
    }

    const horse={id:uid(),clientId,name:e.horseName||'Cavalo',notes:''};
    db.horses.push(horse);

    const contract={
      id:uid(),clientId,
      eventId:billingModel==='pacote'?null:e.eventId,
      billingModel,horseId:billingModel==='por_cavalo'?horse.id:null,
      packageType,
      agreedValue:parseFloat(e.contractedValue)||0,
      paidValue:parseFloat(e.paidValue)||0,
      paymentMethod:e.paymentMethod||'Pix',
      payStatus:e.payStatus||'pendente',
      notes:'',
    };
    db.contracts.push(contract);

    db.participations.push({
      id:uid(),eventId:e.eventId,clientId,horseId:horse.id,contractId:contract.id,
      day:e.day||'',proofName:e.proof||'',inscriptionNumber:e.inscriptionNumber||'',
      category:e.category||'',proofTime:e.proofTime||'',recognitionTime:e.recognitionTime||'',
      recognitionOverride:e.recognitionOverride||false,
      filmStatus:e.filmStatus||'aguardando',
      cameraman:e.cameraman||'',materialLink:e.materialLink||'',filmNotes:e.notes||'',
      checkRecog:e.checkRecog||false,checkPaddock:e.checkPaddock||false,checkProva:e.checkProva||false,
    });
  });
  return db;
}

function loadDB(){
  try{
    const v3=localStorage.getItem('ondigital_v3');
    if(v3)return JSON.parse(v3);
    const v2=localStorage.getItem('ondigital_v2');
    if(v2){const migrated=migrateV2(JSON.parse(v2));localStorage.setItem('ondigital_v3',JSON.stringify(migrated));return migrated;}
  }catch(e){}
  return defaultDB();
}
let db=loadDB();
let _lastSaved='';
function saveDB(){
  db._ts=Date.now();
  const str=JSON.stringify(db);
  localStorage.setItem(STORAGE_KEY,str);
  _lastSaved=str;
  if(window._fsDb){
    window._fsDb.collection('ondigital').doc('data').set(db)
      .catch(e=>console.warn('Firestore save error',e));
  }
}

// Helpers de acesso
function getEvent(id){return db.events.find(e=>e.id===id)}
function getClient(id){return db.clients.find(c=>c.id===id)||{name:'—'}}
function getHorse(id){return db.horses.find(h=>h.id===id)||{name:'—'}}
function getContract(id){return db.contracts.find(c=>c.id===id)}
function getEventParticipations(evtId){return db.participations.filter(p=>p.eventId===evtId)}
function getEventExpenses(evtId){return db.expenses.filter(e=>e.eventId===evtId)}
function getEventTeam(evtId){return db.team.filter(t=>t.eventId===evtId)}
function getClientHorses(clientId){return db.horses.filter(h=>h.clientId===clientId)}

function calcEventFinance(eventId){
  const parts=getEventParticipations(eventId);
  const contractIds=[...new Set(parts.map(p=>p.contractId).filter(Boolean))];
  const partContracts=contractIds.map(id=>db.contracts.find(c=>c.id===id)).filter(Boolean);

  // Avulso = por_cavalo + por_prova vinculados a este evento
  const avulso=[...new Set([
    ...db.contracts.filter(c=>c.eventId===eventId&&c.billingModel!=='pacote').map(c=>c.id),
    ...partContracts.filter(c=>c.billingModel!=='pacote').map(c=>c.id),
  ])].map(id=>db.contracts.find(c=>c.id===id)).filter(Boolean);

  const avulsoRev=avulso.reduce((s,c)=>s+parseFloat(c.agreedValue||0),0);
  const avulsoPaid=avulso.reduce((s,c)=>s+parseFloat(c.paidValue||0),0);
  const pacote=partContracts.filter(c=>c.billingModel==='pacote');

  const expenses=getEventExpenses(eventId);
  const team=getEventTeam(eventId);
  const expCost=expenses.reduce((s,e)=>s+parseFloat(e.value||0),0);
  const teamCost=team.reduce((s,t)=>s+parseFloat(t.dailyRate||0)*parseFloat(t.days||1),0);
  const totalCost=expCost+teamCost;
  const profit=avulsoPaid-totalCost;
  const margin=avulsoPaid>0?Math.round((profit/avulsoPaid)*100):0;
  const avgTicket=avulso.length>0?avulsoRev/avulso.length:0;
  const breakeven=avgTicket>0?Math.ceil(totalCost/avgTicket):0;

  const byCavalo=avulso.filter(c=>c.billingModel==='por_cavalo');
  const byProva=avulso.filter(c=>c.billingModel==='por_prova');

  return{avulsoRev,avulsoPaid,avulsoPending:avulsoRev-avulsoPaid,
    expCost,teamCost,totalCost,profit,margin,breakeven,
    avulsoCount:avulso.length,pacoteCount:pacote.length,partsCount:parts.length,
    porCavaloCount:byCavalo.length,porCavaloRev:byCavalo.reduce((s,c)=>s+parseFloat(c.agreedValue||0),0),
    porProvaCount:byProva.length,porProvaRev:byProva.reduce((s,c)=>s+parseFloat(c.agreedValue||0),0),
  };
}

function _pageAgoraInner(){
  const parts=getEventParticipations(S.eventId);
  const today=todayISO();
  const now=toMins(nowTime());

  // Todas as participações de hoje — mesmo sem horário
  const todayParts=parts
    .filter(p=>!p.day||p.day===today)
    .sort((a,b)=>{
      if(a.proofTime&&!b.proofTime)return -1;
      if(!a.proofTime&&b.proofTime)return 1;
      const td=toMins(a.proofTime||'99:99')-toMins(b.proofTime||'99:99');
      if(td!==0)return td;
      return(parseInt(a.inscriptionNumber)||99999)-(parseInt(b.inscriptionNumber)||99999);
    });

  // "Próximo" só conta participações COM horário definido
  const pendingRecog=todayParts.filter(p=>{
    return p.proofTime&&toMins(p.proofTime)>=now&&!p.checkRecog&&(p.filmStatus==='aguardando'||p.filmStatus==='reconhecimento');
  });
  const nextRecog=pendingRecog[0]||null;
  const pendingProva=todayParts.filter(p=>p.proofTime&&toMins(p.proofTime)>=now&&p.filmStatus!=='entregue'&&p.filmStatus!=='nao_filmado');
  const nextProva=pendingProva[0]||null;

  const alerts=[];
  const overdue=todayParts.filter(p=>toMins(p.proofTime)<now&&p.filmStatus==='aguardando');
  if(overdue.length)alerts.push(`${overdue.length} participação(ões) aguardando com horário já passado`);
  const contracts=parts.map(p=>getContract(p.contractId)).filter(Boolean);
  const pendingPay=contracts.filter(c=>c.payStatus==='pendente');
  if(pendingPay.length)alerts.push(`${pendingPay.length} pagamento(s) pendente(s)`);

  const nextCard=(part,type)=>{
    if(!part)return`<div class="agora-empty"><small>Nenhum${type==='recog'?' reconhecimento':' prova'} próximo</small></div>`;
    const cl=getClient(part.clientId);
    const horse=getHorse(part.horseId);
    const time=type==='recog'?part.recognitionTime:part.proofTime;
    // Cronômetro: 30min antes da prova, conta regressiva
    let countdownHtml='';
    if(type==='recog'&&part.proofTime){
      const b=brNow();
      const nowMinsBR=b.getUTCHours()*60+b.getUTCMinutes();
      const nowSecBR=nowMinsBR*60+b.getUTCSeconds();
      const proofSec=toMins(part.proofTime)*60;
      const secsLeft=proofSec-nowSecBR;
      if(secsLeft>0&&secsLeft<=1800){
        const mm=String(Math.floor(secsLeft/60)).padStart(2,'0');
        const ss=String(secsLeft%60).padStart(2,'0');
        countdownHtml=`<div id="recog-countdown" data-secs="${secsLeft}" style="margin:10px 0;padding:10px 14px;background:rgba(192,154,53,.12);border:1.5px solid var(--gold);border-radius:var(--r);display:flex;align-items:center;gap:10px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div>
            <div style="font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase">Reconhecimento em</div>
            <div id="recog-timer" style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);line-height:1.1">${mm}:${ss}</div>
          </div>
        </div>`;
      }
    }
    return`<div>
      <div class="agora-eyebrow ${type}">${type==='recog'?'🔵 Próximo Reconhecimento':'🟡 Próxima Prova'}</div>
      <div class="agora-client">${esc(cl.name)}</div>
      <div class="agora-horse">🐎 ${esc(horse.name)} · Nº ${esc(part.inscriptionNumber||'—')}</div>
      <div class="agora-time">${esc(time||'—')}</div>
      <div class="agora-meta">${esc(part.proofName||'')}${part.category?' · '+esc(part.category):''}</div>
      ${countdownHtml}
      ${stageBtns(part)}
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" data-action="quick-film" data-id="${part.id}">${IC.film} Status</button>
        <button class="btn btn-ghost btn-sm" data-action="open-part" data-id="${part.id}">${IC.edit} Editar</button>
      </div>
    </div>`;
  };

  const timeline=todayParts.length?todayParts.map(p=>{
    const cl=getClient(p.clientId);
    const horse=getHorse(p.horseId);
    const fs=filmLabel(p.filmStatus||'aguardando');
    const contract=getContract(p.contractId);
    const ps=payLabel(contract?.payStatus||'pendente');
    const isPast=toMins(p.proofTime)<now;
    return`<div class="entry-row" data-action="open-part" data-id="${p.id}" style="${isPast?'opacity:.55':''}border-left:3px solid ${fs.color};padding-left:10px">
      <div class="entry-time">
        <div class="entry-time-main">${esc(p.proofTime||'—')}</div>
        <div class="entry-time-recog">${esc(p.recognitionTime||'')}</div>
      </div>
      <div class="entry-divider"></div>
      <div class="entry-info">
        <div class="entry-client">${esc(cl.name)}</div>
        <div class="entry-horse">🐎 ${esc(horse.name)}</div>
        <div class="entry-badges">
          <span class="badge badge-${p.filmStatus||'aguardando'}">${fs.label}</span>
          <span class="badge badge-${contract?.payStatus||'pendente'}">${ps.label}</span>
        </div>
        ${stageBtns(p)}
      </div>
      <div class="entry-num">${esc(p.inscriptionNumber||'')}</div>
    </div>`;
  }).join(''):`<div class="empty"><p>Nenhuma participação para hoje.</p></div>`;

  return`
    ${alerts.length?`<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start">
      <span style="color:var(--amber);flex-shrink:0;margin-top:1px">${IC.alert}</span>
      <div style="font-size:12px;color:var(--amber)">${alerts.map(a=>`<div>${esc(a)}</div>`).join('')}</div>
    </div>`:''}
    <div class="card-grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div class="agora-next recog">${nextCard(nextRecog,'recog')}</div>
      <div class="agora-next prova">${nextCard(nextProva,'prova')}</div>
    </div>
    <div class="sec-hdr">
      <div><div class="sec-title">Hoje</div><div class="sec-sub">${fmtDate(today)} · ${todayParts.length} participação(ões)</div></div>
      <button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="nova-participacao">${IC.plus} Nova</button>
    </div>
    <div class="stack">${timeline}</div>
  `;
}

// PAGE: ORDEM DO DIA
// ═══════════════════════════════════════════════════════════════
function pageOrdem(){
  const parts=getEventParticipations(S.eventId);
  const days=[...new Set(parts.map(p=>p.day).filter(Boolean))].sort();
  const today=todayISO();
  const selDay=S.filterDay==='all'?today:S.filterDay;
  let filtered=parts.filter(p=>!p.day||p.day===selDay);
  // Ordenar: horário da prova → número de inscrição
  filtered.sort((a,b)=>{
    const td=toMins(a.proofTime||'99:99')-toMins(b.proofTime||'99:99');
    if(td!==0)return td;
    return(parseInt(a.inscriptionNumber)||99999)-(parseInt(b.inscriptionNumber)||99999);
  });

  // Agrupar por prova (proofTime + proofName)
  const byProva={};
  const provaOrder=[];
  filtered.forEach(p=>{
    const key=(p.proofTime||'__')+'::'+(p.proofName||'Sem Prova');
    if(!byProva[key]){byProva[key]=[];provaOrder.push(key);}
    byProva[key].push(p);
  });

  const cards=provaOrder.map(key=>{
    const [pt,pn]=key.split('::');
    const ps=byProva[key];
    const label=`${pt==='__'?'':pt+' · '}${pn}`;
    const cardHtml=ps.map(p=>{
      const cl=getClient(p.clientId);
      const horse=getHorse(p.horseId);
      const fs=filmLabel(p.filmStatus||'aguardando');
      const contract=getContract(p.contractId);
      const psl=payLabel(contract?.payStatus||'pendente');
      return`<div class="ordem-card" style="border-left:3px solid ${fs.color}">
        <div class="ordem-num-box" data-action="edit-num" data-id="${p.id}" title="Clique para editar número">${esc(p.inscriptionNumber||'—')}</div>
        <div class="ordem-info">
          <div class="ordem-client">${esc(cl.name)}</div>
          <div class="ordem-horse">🐎 ${esc(horse.name)}</div>
          <div class="ordem-meta">
            ${contract?billingBadge(contract.billingModel,true):''}
            ${p.recognitionTime?`<span class="ordem-time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${esc(p.recognitionTime)}</span>`:''}
          </div>
          <div class="entry-badges" style="margin-top:5px">
            <span class="badge badge-${p.filmStatus||'aguardando'}" style="font-size:10px">${fs.label}</span>
            <span class="badge badge-${contract?.payStatus||'pendente'}" style="font-size:10px">${psl.label}</span>
          </div>
          ${stageBtns(p)}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0">
          <button class="btn btn-ghost btn-sm" data-action="quick-film" data-id="${p.id}">${IC.film}</button>
          <button class="btn btn-ghost btn-sm" data-action="open-part" data-id="${p.id}">${IC.edit}</button>
        </div>
      </div>`;
    }).join('');
    return`<div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;padding:0 2px">${esc(label)} <span style="font-weight:400">(${ps.length})</span></div>
      <div class="stack">${cardHtml}</div>
    </div>`;
  }).join('');

  const dayTabs=`<div class="filter-tabs">
    ${days.map(d=>`<div class="ftab${selDay===d?' active':''}" data-action="filter-day" data-val="${d}">${fmtDate(d)}</div>`).join('')}
    ${!days.includes(today)?`<div class="ftab${selDay===today?' active':''}" data-action="filter-day" data-val="${today}">Hoje</div>`:''}
  </div>`;

  return`
    <div class="sec-hdr">
      <div><div class="sec-title">Ordem do Dia</div><div class="sec-sub">${fmtDate(selDay)} · ${filtered.length} participação(ões)</div></div>
      <button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="nova-participacao">${IC.plus} Nova</button>
    </div>
    ${days.length>1?dayTabs:''}
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Toque no número para editar</div>
    <div class="stack">${cards||`<div class="empty">${IC.list}<p>Nenhuma participação para este dia.</p></div>`}</div>
  `;
}

function pageAgenda(){
  const parts=getEventParticipations(S.eventId);
  const days=[...new Set(parts.map(p=>p.day).filter(Boolean))].sort();
  let filtered=parts;
  if(S.filterDay!=='all')filtered=filtered.filter(p=>p.day===S.filterDay);
  if(S.filterFilm!=='all')filtered=filtered.filter(p=>(p.filmStatus||'aguardando')===S.filterFilm);
  if(S.search){
    const q=S.search.toLowerCase();
    filtered=filtered.filter(p=>{
      const cl=getClient(p.clientId);
      const horse=getHorse(p.horseId);
      return cl.name.toLowerCase().includes(q)||horse.name.toLowerCase().includes(q)||
        (p.inscriptionNumber||'').toLowerCase().includes(q)||(p.proofName||'').toLowerCase().includes(q);
    });
  }
  filtered.sort((a,b)=>{const dd=(a.day||'').localeCompare(b.day||'');if(dd!==0)return dd;return toMins(a.proofTime||'99:99')-toMins(b.proofTime||'99:99')});

  const byDay={};
  filtered.forEach(p=>{const d=p.day||'Sem data';if(!byDay[d])byDay[d]=[];byDay[d].push(p)});

  const groups=Object.entries(byDay).map(([day,ps])=>`
    <div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;padding:0 2px">
        ${day==='Sem data'?'Sem data':fmtDate(day)} <span style="font-weight:400">(${ps.length})</span>
      </div>
      <div class="stack">
        ${ps.map(p=>{
          const cl=getClient(p.clientId);
          const horse=getHorse(p.horseId);
          const fs=filmLabel(p.filmStatus||'aguardando');
          const contract=getContract(p.contractId);
          const ps2=payLabel(contract?.payStatus||'pendente');
          return`<div class="entry-row" data-action="open-part" data-id="${p.id}" style="border-left:3px solid ${fs.color};padding-left:10px">
            <div class="entry-time">
              <div class="entry-time-main">${esc(p.proofTime||'—')}</div>
              <div class="entry-time-recog">${esc(p.recognitionTime||'')}</div>
            </div>
            <div class="entry-divider"></div>
            <div class="entry-info">
              <div class="entry-client">${esc(cl.name)}</div>
              <div class="entry-horse">🐎 ${esc(horse.name)} · Nº ${esc(p.inscriptionNumber||'—')}</div>
              <div class="entry-meta">${esc(p.proofName||'')}${p.category?' · '+esc(p.category):''}</div>
              <div class="entry-badges">
                <span class="badge badge-${p.filmStatus||'aguardando'}">${fs.label}</span>
                <span class="badge badge-${contract?.payStatus||'pendente'}">${ps2.label}</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0">
              <span style="font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums">${cur(contract?.agreedValue)}</span>
              <button class="btn btn-ghost btn-sm" data-action="quick-film" data-id="${p.id}" onclick="event.stopPropagation()">${IC.film}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');

  return`
    <div class="sec-hdr">
      <div><div class="sec-title">Agenda</div><div class="sec-sub">${filtered.length} de ${parts.length} participação(ões)</div></div>
      <button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="nova-participacao">${IC.plus} Nova</button>
    </div>
    <div class="search-wrap" style="margin-bottom:10px">
      <span class="search-icon">${IC.search}</span>
      <input type="search" placeholder="Buscar cliente, cavalo, inscrição..." id="search-agenda" value="${esc(S.search)}" data-change="search" style="padding-left:32px;width:100%">
    </div>
    <div class="filter-tabs">
      <div class="ftab${S.filterDay==='all'?' active':''}" data-action="filter-day" data-val="all">Todos</div>
      ${days.map(d=>`<div class="ftab${S.filterDay===d?' active':''}" data-action="filter-day" data-val="${d}">${fmtDate(d)}</div>`).join('')}
    </div>
    <div class="filter-tabs">
      <div class="ftab${S.filterFilm==='all'?' active':''}" data-action="filter-film" data-val="all">Todos status</div>

    </div>
    ${groups||'<div class="empty">'+IC.calendar+'<p>Nenhuma participação encontrada.</p></div>'}
  `;
}

function pageClientes(){
  const allClients=db.clients;
  const q=S.search.toLowerCase();
  const filtered=allClients.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.instagram||'').toLowerCase().includes(q));

  const items=filtered.map(c=>{
    const horses=getClientHorses(c.id);
    const eventParts=S.eventId?db.participations.filter(p=>p.eventId===S.eventId&&p.clientId===c.id):[];
    const eventContracts=S.eventId?db.contracts.filter(ct=>ct.clientId===c.id&&(ct.eventId===S.eventId||ct.billingModel==='pacote')):[];
    const totalVal=eventContracts.reduce((s,ct)=>s+parseFloat(ct.agreedValue||0),0);
    const totalPaid=eventContracts.reduce((s,ct)=>s+parseFloat(ct.paidValue||0),0);
    const pending=totalVal-totalPaid;
    const hasPacote=eventContracts.some(ct=>ct.billingModel==='pacote');
    return`<button class="list-item" data-action="open-client" data-id="${c.id}">
      <div class="client-avatar">${esc(c.name[0])}</div>
      <div class="list-item-info">
        <div class="list-item-name" style="display:flex;align-items:center;gap:6px">
          <span>${esc(c.name)}</span>
          ${hasPacote?'<span class="badge badge-pacote" style="font-size:10px">Pacote</span>':''}
        </div>
        <div class="list-item-sub">${eventParts.length} participação(ões) · ${horses.length} cavalo(s)${c.phone?' · '+esc(c.phone):''}</div>
      </div>
      <div class="list-item-right">
        <span style="font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums">${cur(totalVal)}</span>
        ${pending>0?`<span class="badge badge-pendente" style="font-size:10px">-${cur(pending)}</span>`:totalVal>0?'<span class="badge badge-pago" style="font-size:10px">Quitado</span>':''}
      </div>
    </button>`;
  }).join('');

  return`
    <div class="sec-hdr">
      <div><div class="sec-title">Clientes</div><div class="sec-sub">${allClients.length} cliente(s) · globais</div></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" data-action="open-modal" data-modal="novo-cliente">${IC.plus} Novo Cliente</button>
        <button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="nova-participacao">${IC.plus} Nova Participação</button>
      </div>
    </div>
    <div class="search-wrap" style="margin-bottom:10px">
      <span class="search-icon">${IC.search}</span>
      <input type="search" placeholder="Buscar cliente..." id="search-client" value="${esc(S.search)}" data-change="search" style="padding-left:32px;width:100%">
    </div>
    <div class="stack">${items||'<div class="empty">'+IC.users+'<p>Nenhum cliente ainda.</p></div>'}</div>
  `;
}

// PAGE: FINANÇAS
// ═══════════════════════════════════════════════════════════════
function pageFinancas(){
  const F=calcEventFinance(S.eventId);
  const parts=getEventParticipations(S.eventId);

  const byMethod={};PAY_METHODS.forEach(m=>byMethod[m]=0);
  const avulsoContracts=db.contracts.filter(c=>c.eventId===S.eventId&&c.billingModel!=='pacote');
  avulsoContracts.forEach(c=>{if(parseFloat(c.paidValue||0)>0)byMethod[c.paymentMethod||'Outros']=(byMethod[c.paymentMethod||'Outros']||0)+parseFloat(c.paidValue||0)});

  const byFilm={};FILM.forEach(f=>byFilm[f.id]=0);
  parts.forEach(p=>byFilm[p.filmStatus||'aguardando']++);

  const methodBars=PAY_METHODS.filter(m=>byMethod[m]>0).map(m=>{
    const pct=F.avulsoPaid>0?Math.round((byMethod[m]/F.avulsoPaid)*100):0;
    return`<div class="fin-bar-row">
      <div class="fin-bar-label">${esc(m)}</div>
      <div class="fin-bar-track"><div class="fin-bar-fill" style="width:${pct}%"></div></div>
      <div class="fin-bar-val">${cur(byMethod[m])}</div>
    </div>`;
  }).join('');

  return`
    <div class="sec-hdr"><div class="sec-title">Finanças</div></div>
    <div class="card-grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div class="kpi gold"><div class="kpi-label">Faturamento Avulso</div><div class="kpi-value">${cur(F.avulsoRev)}</div><div class="kpi-sub">${F.avulsoCount} contrato(s)</div></div>
      <div class="kpi green"><div class="kpi-label">Recebido</div><div class="kpi-value">${cur(F.avulsoPaid)}</div><div class="kpi-sub">${F.avulsoRev>0?Math.round((F.avulsoPaid/F.avulsoRev)*100):0}% do total</div></div>
      <div class="kpi red"><div class="kpi-label">Pendente</div><div class="kpi-value">${cur(F.avulsoPending)}</div></div>
      <div class="kpi amber"><div class="kpi-label">Custos</div><div class="kpi-value">${cur(F.totalCost)}</div><div class="kpi-sub">Desp. + Equipe</div></div>
      <div class="kpi${F.profit>=0?' green':' red'}" style="grid-column:span 2"><div class="kpi-label">Lucro Líquido</div><div class="kpi-value">${cur(F.profit)}</div><div class="kpi-sub">Margem ${F.margin}% · Ponto de equilíbrio: ${F.breakeven} cliente(s)</div></div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div class="card-title">Breakdown por modelo</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">Por Cavalo (${F.porCavaloCount})</span><span style="font-weight:700">${cur(F.porCavaloRev)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">Por Prova (${F.porProvaCount})</span><span style="font-weight:700">${cur(F.porProvaRev)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--muted)">Pacotes utilizados (${F.pacoteCount})</span><span style="font-weight:700;color:var(--purple)">recorrente</span></div>
      </div>
    </div>

function pageDespesas(){
  const expenses=getEventExpenses(S.eventId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total=expenses.reduce((s,e)=>s+parseFloat(e.value||0),0);
  const rows=expenses.map(e=>`<tr>
    <td>${fmtDate(e.date)}</td>
    <td><span style="font-weight:600">${esc(e.description||'—')}</span><br><span style="font-size:11px;color:var(--muted)">${esc(e.category||'')}</span></td>
    <td><span class="badge" style="color:var(--muted);background:var(--surf2)">${esc(e.method||'—')}</span></td>
    <td style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums">${cur(e.value)}</td>
    <td style="text-align:right"><span class="del-btn" data-action="del-expense" data-id="${e.id}">${IC.trash}</span></td>
  </tr>`).join('');

  return`
    <div class="sec-hdr"><div><div class="sec-title">Despesas</div><div class="sec-sub">Total: ${cur(total)}</div></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="btn btn-ghost" style="justify-content:center;padding:12px 8px" data-action="quick-desp" data-cat="Hospedagem">🏨 Hospedagem</button>
      <button class="btn btn-ghost" style="justify-content:center;padding:12px 8px" data-action="quick-desp" data-cat="Combustível">⛽ Gasolina</button>
      <button class="btn btn-ghost" style="justify-content:center;padding:12px 8px" data-action="quick-desp" data-cat="Alimentação">🍽 Alimentação</button>
      <button class="btn btn-ghost" style="justify-content:center;padding:12px 8px" data-action="open-modal" data-modal="nova-despesa">${IC.plus} Outras</button>
    </div>
    ${expenses.length?`<div class="tbl-wrap card" style="margin-bottom:14px"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Forma</th><th style="text-align:right">Valor</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3" style="font-weight:700;padding:10px 12px">Total</td><td style="text-align:right;font-weight:700;color:var(--red)">${cur(total)}</td><td></td></tr></tfoot>
    </table></div>`:`<div class="empty">${IC.dollar}<p>Nenhuma despesa registrada.</p></div>`}
  `;
}

function pageConfig(){
  const sub=S.sub||'dados';
  const tabs=['dados','eventos','produtos','equipe','equipamentos'];
  const tabLabels={dados:'Dados',eventos:'Eventos',produtos:'Produtos',equipe:'Equipe',equipamentos:'Equipamentos'};
  let content='';
  if(sub==='dados')content=configDados();
  else if(sub==='eventos')content=configEventos();
  else if(sub==='produtos')content=configProdutos();
  else if(sub==='equipe')content=configEquipe();
  else if(sub==='equipamentos')content=configEquip();
  return`
    <div class="sec-hdr"><div class="sec-title">Configurações</div></div>
    <div class="page-tabs">
      ${tabs.map(t=>`<div class="page-tab${sub===t?' active':''}" data-action="config-tab" data-val="${t}">${tabLabels[t]}</div>`).join('')}
    </div>
    ${content}
  `;
}

function configDados(){
  const nClients=db.clients.length;
  const nHorses=db.horses.length;
  const nParts=db.participations.length;

  return`<div class="stack">

      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">BANCO DE DADOS ATUAL</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
        <div>👤 ${nClients} cliente(s)</div><div>🐴 ${nHorses} cavalo(s)</div>
        <div>📋 ${nContracts} contrato(s)</div><div>🎬 ${nParts} participação(ões)</div>
      </div>
    </div>
    <div style="background:var(--surf2);border-radius:var(--r);padding:14px;margin-bottom:4px">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">📤 Exportar Dados</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Baixa um arquivo .json com <strong>todos</strong> os dados — clientes, cavalos, participações, contratos, despesas. Use para backup ou para transferir para outro dispositivo (celular, GitHub Pages).</div>

      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Carrega um arquivo .json exportado anteriormente. <span style="color:var(--red);font-weight:600">Atenção: substitui todos os dados atuais.</span></div>

function configEventos(){
  const items=db.events.map(e=>`<div class="list-item" style="cursor:default">

      <div class="list-item-name">${esc(e.name)}</div>
      <div class="list-item-sub">${esc(e.location||'—')} · ${fmtDate(e.startDate)}${e.endDate&&e.endDate!==e.startDate?' → '+fmtDate(e.endDate):''}</div>

    <div style="display:flex;gap:8px">

function configProdutos(){
  const rows=db.products.map(p=>`<tr>
    <td style="font-weight:600">${esc(p.name)}</td>
    <td style="font-variant-numeric:tabular-nums;color:var(--gold)">${cur(p.price)}</td>

function configEquipe(){
  if(!S.eventId)return'<div class="empty"><p>Selecione um evento primeiro.</p></div>';
  const team=getEventTeam(S.eventId);
  const total=team.reduce((s,t)=>s+parseFloat(t.dailyRate||0)*parseFloat(t.days||1),0);
  const rows=team.map(t=>`<tr>
    <td style="font-weight:600">${esc(t.name)}</td>
    <td style="color:var(--muted)">${esc(t.role||'—')}</td>
    <td>${t.days||1}d</td>
    <td style="color:var(--gold)">${cur(parseFloat(t.dailyRate||0)*parseFloat(t.days||1))}</td>
    <td><span class="del-btn" data-action="del-team" data-id="${t.id}">${IC.trash}</span></td>
  </tr>`).join('');
  return`<div>
    <div class="tbl-wrap card" style="margin-bottom:10px"><table>
      <thead><tr><th>Nome</th><th>Função</th><th>Dias</th><th>Total</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Nenhum membro</td></tr>'}</tbody>
      <tfoot><tr><td colspan="3" style="font-weight:700;padding:10px 12px">Total equipe</td><td style="font-weight:700;color:var(--amber)">${cur(total)}</td><td></td></tr></tfoot>

}

function configEquip(){
  if(!S.eventId)return'<div class="empty"><p>Selecione um evento primeiro.</p></div>';

  const rows=equip.map(e=>`<tr>

    <button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="novo-equip">${IC.plus} Equipamento</button>

function renderModal(){
  switch(S.modal){
    case 'novo-evento':        return modalEvento();
    case 'nova-participacao':  return modalParticipacao();
    case 'editar-participacao':return modalParticipacao(S.editId);
    case 'status-filmagem':    return modalFilmStatus(S.editId);
    case 'nova-despesa':       return modalDespesa();
    case 'novo-produto':       return modalProduto();
    case 'editar-produto':     return modalProduto(S.editId);
    case 'novo-membro':        return modalMembro();
    case 'novo-equip':         return modalEquip();
    case 'ver-cliente':        return modalClient(S.editId);
    case 'add-horse':          return modalAddHorse(S._horseClient);
    case 'novo-cliente':       return modalNovoCliente();
    case 'editar-cliente':     return modalEditCliente(S.editId);
    default: return'';
  }
}

      <form class="form-grid" data-action="save-evento" id="form-evento">
        ${e?`<input type="hidden" name="id" value="${e.id}">`:''}

        <div class="form-row">
          <div class="field"><label>Data início *</label><input type="date" name="startDate" required value="${esc(e?.startDate||todayISO())}"></div>
          <div class="field"><label>Data fim</label><input type="date" name="endDate" value="${esc(e?.endDate||'')}"></div>
        </div>
        <div class="field"><label>Local</label><input name="location" value="${esc(e?.location||'')}" placeholder="Cidade, clube..."></div>
        <div class="field"><label>Organizador</label><input name="organizer" value="${esc(e?.organizer||'')}"></div>
        <div class="field"><label>Observações</label><textarea name="notes">${esc(e?.notes||'')}</textarea></div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-evento').requestSubmit()">${IC.check} Salvar</button>
    </div>
  </div>`;
}

        <div class="field"><label>Cavalo *</label>
          <select name="horseId" required id="sel-horse">
            <option value="">— Selecione —</option>
            ${clientHorses.map(h=>`<option value="${h.id}" ${h.id===part.horseId?'selected':''}>${esc(h.name)}</option>`).join('')}
            <option value="__new_horse__">+ Novo cavalo...</option>

        </div>

          <div class="field"><label>Nome do Cavalo *</label><input name="newHorseName" id="inp-new-horse" placeholder="Nome do cavalo"></div>

    <div class="modal-hdr">
      <div><h3>Status de Filmagem</h3><div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(cl.name)} · 🐎 ${esc(horse.name)}</div></div>
      <button class="hdr-btn" data-action="close-modal">${IC.x}</button>
    </div>
    <div class="modal-body">
      <div class="status-grid">
        ${FILM.map(f=>`<div class="status-opt${(part.filmStatus||'aguardando')===f.id?' selected':''}"
          style="${(part.filmStatus||'aguardando')===f.id?`color:${f.color}`:'color:var(--muted)'}"

// ═══════════════════════════════════════════════════════════════
// FPH IMPORT
// ═══════════════════════════════════════════════════════════════
window._fphResults=null;
window._fphLoading=false;

function normFph(s){
  // Use explicit unicode range U+0300-U+036F for combining diacritics
  return String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
}

function parseFphHtml(html,url){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const fullText=doc.body?doc.body.textContent:'';

  let provaName='';
  let provaTime='';

  // Prova name: find PR.XX in page text
  const prMatch=fullText.match(/PR\.?\s*\d+[^\n\r]{0,150}/);
  if(prMatch)provaName=prMatch[0].replace(/\s+/g,' ').trim().slice(0,120);

  // Time: look for HH:MM or HHhMM NEAR the PR.XX match (within 500 chars)
  // This avoids picking up page/session timestamps that appear earlier in the HTML
  const searchZone=prMatch
    ? fullText.slice(prMatch.index, prMatch.index+500)
    : '';
  const zoneTimeMatch=searchZone.match(/\b(\d{1,2})[h:](\d{2})\b/);
  if(zoneTimeMatch){
    const h=parseInt(zoneTimeMatch[1]),m=parseInt(zoneTimeMatch[2]);
    if(h>=6&&h<=22&&m>=0&&m<=59)
      provaTime=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }
  // Fallback: look for "Horário" label anywhere, then first valid HH:MM
  if(!provaTime){
    const horMatch=fullText.match(/hor[aá]rio[^\d]{0,10}(\d{1,2})[h:](\d{2})/i);
    if(horMatch){
      const h=parseInt(horMatch[1]),m=parseInt(horMatch[2]);
      if(h>=6&&h<=22)provaTime=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    }
  }

  // Parse ALL table rows — try both td-only and any cell
  const participants=[];
  const rows=doc.querySelectorAll('table tr');
  for(const row of rows){
    const cells=row.querySelectorAll('td');
    if(cells.length<3)continue;

    // Order number: extract first run of digits from first cell
    const orderRaw=cells[0].textContent.trim();
    const orderMatch=orderRaw.match(/^(\d+)/);
    if(!orderMatch)continue;
    const orderNum=orderMatch[1];

    // Competitor name: first cell content, cleaned
    const compName=cells[1].textContent.replace(/\s+/g,' ').trim();
    if(!compName||compName.length<4)continue;
    // Skip header-like rows
    if(/competidor|instrutor|or\./i.test(compName))continue;

    // Horse name: everything before first date DD/MM/YYYY
    const horseRaw=cells[2].textContent.replace(/\s+/g,' ').trim();
    const dateIdx=horseRaw.search(/\d{2}\/\d{2}\/\d{4}/);
    const horseName=(dateIdx>0?horseRaw.slice(0,dateIdx):horseRaw.split('|')[0]).trim();

    // Category: try column 4, fallback to last column
    const category=(cells.length>4?cells[4]:cells[cells.length-1]).textContent.replace(/\s+/g,' ').trim();

    participants.push({inscriptionNumber:orderNum,competitorName:compName,horseName,category});
  }

  return{url,provaName,provaTime,participants,error:null};
}

async function fphFetchUrl(url){
  const proxies=[
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  ];
  let lastErr='Todos os proxies falharam';
  for(const proxyUrl of proxies){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),28000);
      const res=await fetch(proxyUrl,{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok){lastErr='HTTP '+res.status;continue;}
      return await res.text();
    }catch(e){lastErr=e.message||String(e);}
  }
  throw new Error(lastErr);
}

async function fphFetchAndParse(urls){
  const results=[];
  for(const raw of urls){
    const url=raw.trim();
    if(!url)continue;
    try{
      const html=await fphFetchUrl(url);
      results.push(parseFphHtml(html,url));
    }catch(err){
      results.push({url,provaName:'',provaTime:'',participants:[],error:err.message});
    }
  }
  return results;
}

function fphMatchClients(results){
  const matched=[];
  results.forEach(r=>{
    if(r.error||!r.participants.length)return;
    r.participants.forEach(p=>{
      const normComp=normFph(p.competitorName);
      let client=null;
      for(const c of db.clients){
        const normC=normFph(c.name);
        if(normC===normComp){client=c;break;}
        const words=normC.split(' ').filter(w=>w.length>2);
        if(words.length>=2&&words.every(w=>normComp.includes(w))){client=c;break;}
      }
      if(client){
        // Check duplicate
        const today=todayISO();
        const dup=db.participations.some(x=>
          x.eventId===S.eventId&&x.clientId===client.id&&x.day===today&&
          (x.inscriptionNumber===p.inscriptionNumber||(x.proofName&&x.proofName===r.provaName))
        );
        matched.push({client,provaName:r.provaName,provaTime:r.provaTime,url:r.url,
          inscriptionNumber:p.inscriptionNumber,horseName:p.horseName,category:p.category,dup});
      }
    });
  });
  return matched;
}

async function fphDoFetch(){
  const ta=document.getElementById('fph-url-input');
  if(!ta)return;
  const urls=ta.value.split('\n').filter(u=>u.trim());
  if(!urls.length){showToast('Cole pelo menos uma URL','error');return;}
  window._fphLoading=true;window._fphResults=null;render();
  window._fphResults=await fphFetchAndParse(urls);
  window._fphLoading=false;render();
}

function fphDoImportSelected(){
  const checkboxes=document.querySelectorAll('.fph-check:checked');
  if(!checkboxes.length){showToast('Selecione ao menos uma participação','error');return;}
  const dateInput=document.getElementById('fph-import-date');
  const today=dateInput?.value||todayISO();
  // Build map: provaName key → time from editable input
  const timeOverrides={};
  document.querySelectorAll('.fph-time-input').forEach(inp=>{
    if(inp.value)timeOverrides[inp.dataset.key]=inp.value;
  });
  let count=0;
  checkboxes.forEach(cb=>{
    const idx=parseInt(cb.dataset.idx);
    const item=window._fphMatchCache[idx];
    if(!item)return;
    // Use time from editable input if available
    const provaKey=item.provaName||item.url||'';
    const provaTime=timeOverrides[provaKey]||item.provaTime||'';
    // Find or create horse
    let horse=db.horses.find(h=>h.clientId===item.client.id&&normFph(h.name)===normFph(item.horseName));
    if(!horse){horse={id:uid(),clientId:item.client.id,name:item.horseName,notes:''};db.horses.push(horse);}
    // Duplicate check: mesmo cliente + mesmo número + mesma prova = duplicata
    const dup=db.participations.find(x=>
      x.eventId===S.eventId&&x.clientId===item.client.id&&x.proofName===item.provaName&&x.inscriptionNumber===item.inscriptionNumber
    );
    if(dup){
      dup.inscriptionNumber=item.inscriptionNumber;
      dup.proofTime=provaTime;
      dup.recognitionTime=calcRecog(provaTime);
    }else{
      db.participations.push({
        id:uid(),eventId:S.eventId,clientId:item.client.id,horseId:horse.id,contractId:'',
        day:today,proofName:item.provaName,inscriptionNumber:item.inscriptionNumber,
        category:item.category,proofTime:provaTime,recognitionTime:calcRecog(provaTime),
        recognitionOverride:false,filmStatus:'aguardando',
        cameraman:'',materialLink:'',filmNotes:'',checkRecog:false,checkPaddock:false,checkProva:false,
      });
    }
    count++;
  });
  saveDB();
  window._fphResults=null;window._fphMatchCache=null;
  showToast(`${count} participação(ões) importada(s)!`);
  S.page='agora';render();
}
